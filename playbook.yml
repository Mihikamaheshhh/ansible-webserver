---
- name:  Configure Web Server
  hosts: webservers
  become: yes 
  
  tasks:

    - name: Update apt packages 
      apt:
        update_cache: yes

    - name: Install Nginx
      apt:
        name: nginx
        state: present 

    - name: Start Nginx
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Deploy website
      copy:
        src: website/index.html
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'








